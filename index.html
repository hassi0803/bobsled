<script type="module">
// Firebase を読み込み、匿名ログインして window.LB（ランキングの読み書き）を用意する
const CFG = window.FIREBASE_CONFIG;
if (CFG) (async () => {
  try {
    const B = 'https://www.gstatic.com/firebasejs/10.12.2/';
    const [A, U, F] = await Promise.all([import(B + 'firebase-app.js'), import(B + 'firebase-auth.js'), import(B + 'firebase-firestore.js')]);
    const app = A.initializeApp(CFG);
    const db = F.getFirestore(app);
    const cred = await U.signInAnonymously(U.getAuth(app));
    const uid = cred.user.uid;
    const col = board => F.collection(db, 'boards', board, 'scores');
    window.LB = {
      uid,
      async top(board, n) {
        const snap = await F.getDocs(F.query(col(board), F.orderBy('t'), F.limit(n)));
        return snap.docs.map(d => Object.assign({ uid: d.id }, d.data()));
      },
      async mine(board) { const d = await F.getDoc(F.doc(col(board), uid)); return d.exists() ? d.data() : null; },
      async rankOf(board, t) { const c = await F.getCountFromServer(F.query(col(board), F.where('t', '<', t))); return c.data().count + 1; },
      // 自分の記録より速いときだけ書き込む（名前だけ変わったときは名前を更新）
      async submit(board, run) {
        const ref = F.doc(col(board), uid);
        const cur = await F.getDoc(ref);
        if (cur.exists() && cur.data().t <= run.t) {
          if (cur.data().name !== run.name || cur.data().cc !== (run.cc || '')) await F.updateDoc(ref, { name: run.name, cc: run.cc || '', ts: F.serverTimestamp() });
          return false;
        }
        await F.setDoc(ref, { name: run.name, cc: run.cc || '', t: run.t, splits: run.splits, crashed: run.crashed, ts: F.serverTimestamp() });
        return true;
      },
    };
  } catch (e) {
    console.warn('ランキングに接続できません', e);
    window.LB_ERROR = String((e && e.message) || e);
  }
  dispatchEvent(new Event('lb-ready'));
})();
</script>

//   カーブ … 外側の壁が大きな円弧のバンクになる（出口に向けて徐々に垂直へ戻る）
const FH = 36;                    // 底面の半幅
const RB = 70;                    // バンクの円弧半径（カーブ中）
const R_MIN = 6;                  // 垂直な壁の角の丸み
const WALL_H = 46;                // 直線の垂直な壁の高さ
const PHI_LIM = 1.5;              // そりが上がれる限界（86°）
const PHI_TOP = 1.58;             // 壁の上端（見た目）
const BANK_LEAD = 160;            // カーブ手前からバンクが立ち始める距離
const BANK_LAG = 340;             // カーブを抜けてもバンクが残る距離
const wallR = b => R_MIN + (RB - R_MIN) * b;          // b: バンク度 0(垂直)〜1(カーブ)
const FLOOR_SHRINK = 0.88;        // カーブでは平らな底がほぼ無くなる
// 外側（バンクが立つ側）だけ底が無くなる。内側の壁の位置は直線と同じ
const floorOf = b => FH * (1 - FLOOR_SHRINK * b);

const CF = 0.95;                  // 遠心力の効き

// 断面上の位置 u（中心からの断面に沿った距離）とその側のバンク度 b → [横, 高さ, 壁の角度]
function profileB(u, b, fh = floorOf(b)) {
  const a = Math.abs(u), sg = u < 0 ? -1 : 1;
  if (a <= fh) return [u, 0, 0];
  const r = wallR(b);
  const phi = (a - fh) / r;
  if (phi <= PHI_TOP) return [sg * (fh + r * Math.sin(phi)), r * (1 - Math.cos(phi)), phi];
  return [sg * (fh + r * Math.sin(PHI_TOP)), r * (1 - Math.cos(PHI_TOP)) + (a - fh - r * PHI_TOP), PHI_TOP];
}
// 壁の上端の位置

  const r = wallR(b);
  return { x: fh + r * Math.sin(PHI_TOP), h: Math.max(r * (1 - Math.cos(PHI_TOP)), WALL_H) };

const TRANS = 0.3;   // カーブの入口・出口の長さ（カーブ長に対する割合の目安）

    for (let i = 0; i < n2; i++) push(sg / c.R, c.g, sg * bk);
    for (let i = 0; i < n1; i++) { const f = smooth(1 - (i + 0.5) / n1); push(sg * f / c.R, c.g, sg * f * bk); }

  def.layout.forEach((c, i) => { curve(c, i + 1); straight(c.gap * (c.up ? 1 : gapScale), c.gg !== undefined ? c.gg : c.g); });

function courseAt(s) {
  const C = COURSE;
  if (s <= 0) return { x: 0, y: -s * C.GR[0], z: s, th: 0, k: 0, gr: C.GR[0], bl: 0, br: 0 };
  const f = s / DS;
  let i = Math.floor(f);

    const j = C.n - 1, over = s - C.len, t = C.TH[j];
    return { x: C.X[j] + Math.sin(t) * over, y: C.Y[j] - C.GR[j] * over, z: C.Z[j] + Math.cos(t) * over, th: t, k: 0, gr: C.GR[j], bl: 0, br: 0 };
  }
  const t = f - i;
  const L = (A) => A[i] + (A[i + 1] - A[i]) * t;

function curveIndexAt(s) {
  for (let i = 0; i < CURVES.length; i++) if (s < CURVES[i].s1) return i;
  return CURVES.length;
}

    hits: 0, touching: false, run: 0, danger: 0,
    jumpRating: null, jumpV: 0, jumpT: 0, boarded: 0, boardT: 0, splits: [],

    crashT: 0, crashSide: 1, crashCurve: 0, crashed: false,

// inp = { steer: -1/0/1, mash: 押した回数, jump: bool }
function stepSim(S, inp, dt, ev) {

      else if (toLine <= GOOD_WIN) { rating = 'GOOD'; mul = 1.03; }
      else { rating = 'EARLY'; mul = 1.0; }

      S.boarded = 1; S.boardT = 0;

  if (crashed) S.crashT += dt;
  const racing = S.phase === 'ride' || crashed;
  if (racing) S.t += dt;

  // 前から順番に乗り込む（残りのメンバーは押し続ける）

    S.boardT += dt;
    const nb = Math.min(4, 1 + Math.floor(S.boardT / BOARD_GAP));
    while (S.boarded < nb) { ev.push({ type: 'board', i: S.boarded }); S.boarded++; }

  S.phiS = S.phi * (S.u < 0 ? -1 : 1);

    S.finalT = S.t - (S.s - S_FIN) / Math.max(S.v, 1);
    ev.push({ type: 'finish' });
  }

        ctx.fillStyle = 'rgba(230,57,70,0.35)'; ctx.beginPath(); ctx.arc(px, py, 7, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#e63946'; ctx.beginPath(); ctx.arc(px, py, 3.8, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.4; ctx.stroke();
      }
      ctx.restore();
      // 名前と距離
      ctx.textAlign = 'center';
      ctx.fillStyle = sel ? '#ffd166' : '#ffffff'; ctx.font = `900 ${def.name.length > 10 ? 11 : 13}px system-ui,"Hiragino Sans",sans-serif`;
      ctx.fillText(def.name, c.x + c.w / 2, c.y + 124);
      ctx.fillStyle = '#9fc3e0'; ctx.font = 'bold 11px system-ui,"Hiragino Sans",sans-serif';
      ctx.fillText(th.m + 'm・' + th.curves + L('カーブ', ' crv'), c.x + c.w / 2, c.y + 141);
    }
    ctx.textAlign = 'left';
  }

  function popup(text, color, sub) { popups.push({ text, color, sub: sub || '', t: 0, life: 1.5 }); }

  function handleEvents(ev) {
    for (const e of ev) {
      if (e.type === 'jump') {
        const col = { PERFECT: '#ffd166', GOOD: '#7ee081', EARLY: '#9fc3e0', LATE: '#ff6b6b' }[e.rating];
        popup(e.rating, col, L('スタート ', 'START ') + Math.round(S.jumpV * KMH) + ' km/h');
        if (e.rating === 'PERFECT') sfx.chime(3); else if (e.rating === 'GOOD') sfx.chime(2);
      } else if (e.type === 'board') {
        boardTime[e.i] = clock;
        sfx.board(e.i);
        bump = e.i === 0 ? 10 : 5;
      } else if (e.type === 'hit') {
        shake = e.wall ? Math.min(9, 3 + e.rel / 50) : Math.min(18, 5 + e.rel / 30);
        sfx.hit(e.rel, e.wall);
      } else if (e.type === 'split') {
        lastSplit = e.i; lastSplitClock = clock;
        const d = diffAt(e.i, rec);
        if (d !== null) sfx.chime(d <= 0 ? 2 : 1);
      } else if (e.type === 'dnf') {
        popup(L('停止…', 'Stopped…'), '#ff6b6b');
        sfx.fail();
      } else if (e.type === 'crash') {
        shake = 22;
        popup(L('転倒！', 'CRASH!'), '#ff6b6b');
        sfx.crash();
      } else if (e.type === 'curve') {
        if (e.q > 0.8) { popup('EXCELLENT LINE', '#ffd166'); sfx.chime(4); }
        else if (e.q > 0.6) popup('GOOD LINE', '#7ee081');
        else if (e.q < 0.3) popup('ROUGH', '#ff6b6b');
      } else if (e.type === 'finish') {
        prevBest = best; prevPb = pb; prevRec = rec;
        const run = { t: S.finalT, splits: S.splits.slice(), mine: true, crashed: S.crashed, name: playerName };
        lbMsg = '';
        if ((pb === null || S.finalT < pb.t)) { pb = run; best = run.t; saveJSON(COURSE_DEF.best, run); newRecord = true; }
        if ((rec === null || S.finalT < rec.t)) { rec = run; saveJSON(crKey(COURSE_DEF), run); newCR = true; }
        perImproved = updatePeriods(COURSE_DEF, run);
        const pers = perImproved.concat(newRecord ? ['all'] : []);
        if (pers.length && lbOn()) submitRun(COURSE_DEF, run, true, pers);
        sfx.finish(newRecord);
      }
    }
  }

  function update(dt) {
    clock += dt * 1000;
    if (mode === 'countdown') {
      const prevN = Math.ceil(countdown);
      countdown -= dt;
      if (countdown > 0 && Math.ceil(countdown) < prevN) sfx.beep(false);
      if (countdown <= 0) { mode = 'play'; popup('GO!', '#4fc3f7', L('連打！', 'PUSH!')); sfx.beep(true); }
    }
    if (mode === 'play') {
      const steps = 4, h = dt / steps, ev = [];
      const steer = clamp((keys.right ? 1 : 0) - (keys.left ? 1 : 0) + touchSteer(), -1, 1);
      for (let i = 0; i < steps; i++) {
        stepSim(S, { steer, mash: i === 0 ? mashQueue : 0, jump: i === 0 && jumpQueued }, h, ev);
      }
      mashQueue = 0; jumpQueued = false;
      handleEvents(ev);
    }
    sfx.update(S, mode === 'play' && S.phase !== 'push' && S.phase !== 'dnf');
    // 視点：プッシュ中は立って横から、乗り込んだら座って中央
    const seated = S.phase !== 'push';
    const k = Math.min(1, (seated ? 7 : 4) * dt);
    camEye += ((seated ? 26 : 66) - camEye) * k;
    camSide += ((seated ? 0 : -34) - camSide) * k;
    camBack += ((seated ? 0 : -30) - camBack) * k;
    for (const p of popups) p.t += dt;
    popups = popups.filter(p => p.t < p.life);
    shake *= Math.exp(-9 * dt);
    bump *= Math.exp(-10 * dt);
    updateFX(dt);
    const now = performance.now();
    mashTimes = mashTimes.filter(t => now - t < 1000);
  }

  // =================================================================
  //  3D 描画
  // =================================================================
  let cam = null;
  function norm(v) { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; }
  function cross(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
  function buildCamera() {
    const c = courseAt(S.s + camBack);
    const N = [Math.cos(c.th), 0, -Math.sin(c.th)];
    const T = [Math.sin(c.th), 0, Math.cos(c.th)];
    const seatedBlend = clamp((66 - camEye) / 40, 0, 1);
    const u = S.u * seatedBlend + camSide;
    const sg = u < 0 ? -1 : 1;
    const [hx, hy, phi] = profileB(u, sg < 0 ? c.bl : c.br);
    const nrm = [-sg * Math.sin(phi) * N[0], Math.cos(phi), -sg * Math.sin(phi) * N[2]];
    const vib = S.phase === 'ride' ? (Math.random() - 0.5) * S.v / 1500 * 1.2 : 0;
    const pos = [c.x + N[0] * hx + nrm[0] * camEye, c.y + hy + nrm[1] * camEye + vib - bump * 0.4, c.z + N[2] * hx + nrm[2] * camEye];
    if (S.phase === 'push') pos[1] += Math.abs(Math.sin(S.run / 22)) * 5 * Math.min(1, S.v / 200);
    // 向き：コースの向き + 横滑りのヨー + 勾配のピッチ
    const yaw = S.phase === 'push' ? 0 : Math.atan2(S.vu * Math.cos(phi), Math.max(S.v, 200)) * 0.7;
    const cyw = Math.cos(yaw), syw = Math.sin(yaw);
    const F = norm([T[0] * cyw + N[0] * syw, -c.gr * 0.9 - 0.05, T[2] * cyw + N[2] * syw]);
    // ロール：壁を上がると傾く
    const rollK = 0.82;
    let Up = norm([nrm[0] * rollK, 1 - rollK + nrm[1] * rollK, nrm[2] * rollK]);
    if (shake > 0.3) {
      const j = (Math.random() - 0.5) * shake * 0.012;
      Up = norm([Up[0] + N[0] * j, Up[1], Up[2] + N[2] * j]);
      pos[1] += (Math.random() - 0.5) * shake * 0.6;
    }
    let R = norm(cross(Up, F));
    Up = cross(F, R);
    // 転倒：横倒しに転がる
    if (S.crashed) {
      const a = S.crashSide * 1.45 * smooth(clamp(S.crashT / 0.6, 0, 1)) + (S.v > 50 ? (Math.random() - 0.5) * 0.04 : 0);
      const ca = Math.cos(a), sa = Math.sin(a);
      Up = norm([Up[0] * ca + R[0] * sa, Up[1] * ca + R[1] * sa, Up[2] * ca + R[2] * sa]);
      R = norm(cross(Up, F));
      pos[1] -= 14 * clamp(S.crashT / 0.7, 0, 1);
    }
    cam = { pos, F, R, U: Up };
  }
  function toCam(x, y, z) {
    const dx = x - cam.pos[0], dy = y - cam.pos[1], dz = z - cam.pos[2];
    return [dx * cam.R[0] + dy * cam.R[1] + dz * cam.R[2],
            dx * cam.U[0] + dy * cam.U[1] + dz * cam.U[2],
            dx * cam.F[0] + dy * cam.F[1] + dz * cam.F[2]];
  }
  function clipNear(poly) {
    const out = [];
    for (let i = 0; i < poly.length; i++) {
      const a = poly[i], b = poly[(i + 1) % poly.length];
      const ia = a[2] >= NEAR, ib = b[2] >= NEAR;
      if (ia) out.push(a);
      if (ia !== ib) {
        const t = (NEAR - a[2]) / (b[2] - a[2]);
        out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, NEAR]);
      }
    }
    return out;
  }
  const proj = v => [W / 2 + FOCAL * v[0] / v[2], CY - FOCAL * v[1] / v[2]];
  function fillPoly(poly, color) {
    const p = clipNear(poly);
    if (p.length < 3) return;
    let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
    const sp = p.map(v => {
      const x = W / 2 + FOCAL * v[0] / v[2], y = CY - FOCAL * v[1] / v[2];
      if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y;
      return [x, y];
    });
    if (maxX < -20 || minX > W + 20 || maxY < -20 || minY > H + 20) return;
    ctx.beginPath();
    ctx.moveTo(sp[0][0], sp[0][1]);
    for (let i = 1; i < sp.length; i++) ctx.lineTo(sp[i][0], sp[i][1]);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = color;
    ctx.stroke();
  }
  function cameraRoll() { return Math.atan2(cam.R[1], cam.U[1]); }

  const CLOUDS = [[0.3, -330, 300], [1.4, -260, 220], [2.6, -380, 340], [3.7, -300, 260], [4.9, -350, 300], [5.8, -240, 200]];
  // 空・山・遠くの雪原
  function drawBackground() {
    ctx.fillStyle = '#eef3f8';
    ctx.fillRect(-40, -40, W + 80, H + 80);
    const Fh = norm([cam.F[0], 0, cam.F[2]]);
    const Rh = norm([cam.R[0], 0, cam.R[2]]);
    const far = 1e6;
    const pc = toCam(cam.pos[0] + Fh[0] * far, cam.pos[1], cam.pos[2] + Fh[2] * far);
    const pr = toCam(cam.pos[0] + (Fh[0] + Rh[0] * 0.5) * far, cam.pos[1], cam.pos[2] + (Fh[2] + Rh[2] * 0.5) * far);
    const a = proj(pc), b = proj(pr);
    const ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
    ctx.save();
    ctx.translate(a[0], a[1]);
    ctx.rotate(ang);
    const sky = ctx.createLinearGradient(0, -700, 0, 0);
    sky.addColorStop(0, '#3a73b5'); sky.addColorStop(0.55, '#86b2dd'); sky.addColorStop(0.9, '#cfe0ef'); sky.addColorStop(1, '#e6eef6');
    ctx.fillStyle = sky;
    ctx.fillRect(-1400, -1600, 2800, 1600);
    const heading = Math.atan2(cam.F[0], cam.F[2]);
    const wrap = a => Math.atan2(Math.sin(a), Math.cos(a));
    // 太陽のまぶしさ
    const sd = wrap(Math.atan2(SUN[0], SUN[2]) - heading);
    if (Math.abs(sd) < 1.25) {
      const sx = FOCAL * Math.tan(sd), sy = -150;
      const gl = ctx.createRadialGradient(sx, sy, 4, sx, sy, 260);
      gl.addColorStop(0, 'rgba(255,255,245,0.95)'); gl.addColorStop(0.08, 'rgba(255,250,225,0.7)'); gl.addColorStop(1, 'rgba(255,250,230,0)');
      ctx.fillStyle = gl; ctx.fillRect(sx - 260, sy - 260, 520, 520);
    }
    // 雲（向きに合わせて流れる）
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    for (const [ang, y, w] of CLOUDS) {
      const d = wrap(ang - heading);
      if (Math.abs(d) > 1.3) continue;
      const x = FOCAL * Math.tan(d);
      for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.ellipse(x + (k - 1.5) * w * 0.32, y - (k % 2) * w * 0.07, w * 0.3, w * 0.09, 0, 0, Math.PI * 2); ctx.fill(); }
    }
    // 山（雪をかぶった遠景 → 手前の山 → 森）
    const layers = [[1.0, ['#f6f9fc', '#b3c5d8'], 92, 1.0], [1.0, ['#e9eff6', '#8fa6bf'], 56, 2.3], [1.0, ['#4f6d6a', '#3f5b58'], 16, 9.0]];
    for (const [px, cols, hgt, fr] of layers) {
      const mg = ctx.createLinearGradient(0, -hgt, 0, 0);
      mg.addColorStop(0, cols[0]); mg.addColorStop(0.45, cols[1]); mg.addColorStop(1, cols[1]);
      ctx.fillStyle = mg;
      ctx.beginPath();
      ctx.moveTo(-1400, 4);
      for (let x = -1400; x <= 1400; x += 10) {
        const t = heading + x / FOCAL * px;
        const m = Math.sin(t * 3 * fr) * 0.5 + Math.sin(t * 7.3 * fr + 1) * 0.3 + Math.sin(t * 13.1 * fr + 2) * 0.2;
        ctx.lineTo(x, -hgt * (0.55 + 0.45 * m));
      }
      ctx.lineTo(1400, 4);
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillStyle = '#eef3f8';
    ctx.fillRect(-1400, 0, 2800, 1600);
    ctx.restore();
  }

  function drawTrack() {
    const ss = [];
    let s = S.s - 60;
    const end = S.s + VIEW_DIST;
    while (s < end) {
      ss.push(s);
      const d = s - S.s;
      s += d < 300 ? 14 : d < 900 ? 26 : d < 1800 ? 44 : 70;
    }
    const secs = ss.map(s => {
      const c = courseAt(s);
      const nx = Math.cos(c.th), nz = -Math.sin(c.th);
      const wp = profPts(c.bl, c.br).map(p => [c.x + nx * p[0], c.y + p[1], c.z + nz * p[0]]);
      return { s, th: c.th, wp, pts: wp.map(v => toCam(v[0], v[1], v[2])) };
    });
    const sun = norm(SUN), cp = cam.pos;
    // 木を区間ごとに振り分け
    let ti = 0;
    while (ti < trees.length && trees[ti].s < ss[0]) ti++;
    const treeBins = new Map();
    for (let i = 0; i < secs.length - 1; i++) {
      const list = [];
      while (ti < trees.length && trees[ti].s < secs[i + 1].s) { list.push(trees[ti]); ti++; }
      if (list.length) treeBins.set(i, list);
    }
    ctx.lineWidth = 1;
    ctx.lineJoin = 'round';
    // 遠い方から描く
    for (let i = secs.length - 2; i >= 0; i--) {
      const A = secs[i], B = secs[i + 1];
      const dist = A.s - S.s;
      const fog = clamp((dist - 900) / (VIEW_DIST - 900), 0, 1) * 0.9;
      const bandF = dist < 1200 ? ((Math.floor(A.s / 110) % 2) ? 1 : 0.965) : 1;
      const T = [Math.sin(A.th), 0, Math.cos(A.th)];
      for (let j = 0; j < PROF.length - 1; j++) {
        const sc = STRIP_COL[j];
        // 面の向き（断面の辺 × 進行方向）で太陽の当たり方を決める
        const a = A.wp[j], b = A.wp[j + 1];
        const n = norm(cross(T, [b[0] - a[0], b[1] - a[1], b[2] - a[2]]));
        const ndl = n[0] * sun[0] + n[1] * sun[1] + n[2] * sun[2];
        let f = (0.93 + 0.15 * Math.max(0, ndl) + 0.04 * n[1]) * bandF;
        let spec = 0;
        if (sc.k <= 7) {
          // 氷のつや：視線を面で反射させ、太陽や明るい空の方を向くほど白く光る
          const v = norm([(a[0] + b[0]) / 2 - cp[0], (a[1] + b[1]) / 2 - cp[1], (a[2] + b[2]) / 2 - cp[2]]);
          const vn = v[0] * n[0] + v[1] * n[1] + v[2] * n[2];
          const r = [v[0] - 2 * vn * n[0], v[1] - 2 * vn * n[1], v[2] - 2 * vn * n[2]];
          const rs = Math.max(0, r[0] * sun[0] + r[1] * sun[1] + r[2] * sun[2]);
          spec = Math.min(0.55, rs ** 16 * 0.5 + Math.max(0, r[1]) ** 3 * 0.14);
        }
        fillPoly([A.pts[j], A.pts[j + 1], B.pts[j + 1], B.pts[j]], shadeS(sc.col, f, spec, fog));
      }
      // ランナーが削った筋（近くだけ）
      if (dist < 1100 && dist > -40) {
        const ga = 0.11 * (1 - dist / 1100);
        for (const u of GROOVES) floorQuad(A.s, B.s, u - 0.45, u + 0.45, `rgba(110,140,170,${ga})`, 0.4);
      }
      if (dist < 1600) {
        const seam = shade(hex('#7fa9cc'), 1, fog);
        for (const j of [SEAM_L, SEAM_R]) fillPoly([A.pts[j], lift(A.pts[j]), lift(B.pts[j]), B.pts[j]], seam);
      }
      drawDecals(A.s, B.s, fog);
      const tl = treeBins.get(i);
      if (tl) for (const t of tl) drawTree(t, fog);
    }
  }

  const GROOVES = [-27, -12, -4, 9, 23];
  // 床に貼るライン
  function floorQuad(s0, s1, u0, u1, color, hgt = 0.6) {
    const a = courseAt(s0), b = courseAt(s1);
    const P = (c, u) => {
      const [hx, hy] = profileB(u, u < 0 ? c.bl : c.br);
      return toCam(c.x + Math.cos(c.th) * hx, c.y + hy + hgt, c.z - Math.sin(c.th) * hx);
    };
    fillPoly([P(a, u0), P(a, u1), P(b, u1), P(b, u0)], color);
  }
  function drawDecals(s0, s1, fog) {
    const inR = x => x >= s0 && x < s1;
    if (inR(0)) checker(0, '#2e6fb5');
    if (inR(JUMP_S - GOOD_WIN)) {
      floorQuad(JUMP_S - GOOD_WIN, JUMP_S - PERFECT_WIN, -FH, FH, 'rgba(255,209,102,0.55)');
      floorQuad(JUMP_S - PERFECT_WIN, JUMP_S, -FH, FH, 'rgba(126,224,129,0.6)');
      floorQuad(JUMP_S, JUMP_S + 10, -FH - 40, FH + 40, '#e63946', 1);
    }
    if (inR(S_FIN)) { checker(S_FIN, '#d62839'); finishGate(fog); }
    for (const cu of CURVES) if (inR(cu.s0 - 260)) curveSign(cu, cu.s0 - 260, fog);
    for (let ls = Math.ceil(s0 / LAMP_SP) * LAMP_SP; ls < s1; ls += LAMP_SP) if (ls - S.s < 2800 && ls > 200) drawLamp(ls, fog);
  }
  // 照明の柱（左右交互）と、氷に映るその光
  const LAMP_SP = 1000;
  const POLE_COL = hex('#76818e'), LAMP_COL = hex('#fff7dc');
  function drawLamp(ls, fog) {
    const side = Math.round(ls / LAMP_SP) % 2 ? 1 : -1;
    const c = courseAt(ls);
    const nx = Math.cos(c.th), nz = -Math.sin(c.th);
    const wt = wallTop(side < 0 ? c.bl : c.br);
    const xb = side * (wt.x + 52), yb = wt.h - 3, yt = yb + 300, xa = xb - side * 74;
    const P = (x, y) => toCam(c.x + nx * x, c.y + y, c.z + nz * x);
    const pc = shade(POLE_COL, 1, fog);
    fillPoly([P(xb - 3.5, yb), P(xb + 3.5, yb), P(xb + 3.5, yt), P(xb - 3.5, yt)], pc);
    fillPoly([P(xb, yt - 6), P(xa, yt + 4), P(xa, yt + 9), P(xb, yt)], pc);
    fillPoly([P(xa - 13, yt + 3), P(xa + 13, yt + 3), P(xa + 11, yt - 6), P(xa - 11, yt - 6)], shade(LAMP_COL, 1.05, fog * 0.5));
    if (ls - S.s < 1500) floorQuad(ls - 30, ls + 80, side * 14 - 5, side * 14 + 5, `rgba(255,255,255,${0.30 * (1 - fog)})`, 0.5);
  }
  function checker(s, col) {
    const n = 8;
    for (let r = 0; r < 2; r++) for (let i = 0; i < n; i++) {
      const u0 = -FH + (i / n) * FH * 2, u1 = -FH + ((i + 1) / n) * FH * 2;
      floorQuad(s + r * 12, s + r * 12 + 12, u0, u1, (i + r) % 2 ? '#1b2633' : '#ffffff');
    }
    floorQuad(s - 6, s, -FH - 8, FH + 8, col, 1);
  }
  function billboardText(P, txt, worldSize, color, alpha = 1) {
    if (P[2] <= NEAR) return;
    const [x, y] = proj(P);
    const sz = FOCAL * worldSize / P[2];
    if (sz < 5) return;
    ctx.save(); ctx.translate(x, y); ctx.rotate(cameraRoll());
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color; ctx.font = `900 ${sz}px system-ui,sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(txt, 0, 0);
    ctx.restore();
  }
  function finishGate(fog) {
    const c = courseAt(S_FIN);
    const nx = Math.cos(c.th), nz = -Math.sin(c.th);
    const wt = wallTop(0), top = wt.h;
    const xw = wt.x + 10;
    const P = (x, y) => toCam(c.x + nx * x, c.y + y, c.z + nz * x);
    fillPoly([P(-xw - 8, top), P(-xw, top), P(-xw, 262), P(-xw - 8, 262)], '#334455');
    fillPoly([P(xw, top), P(xw + 8, top), P(xw + 8, 262), P(xw, 262)], '#334455');
    fillPoly([P(-xw - 8, 216), P(xw + 8, 216), P(xw + 8, 262), P(-xw - 8, 262)], shade(hex('#d62839'), 1, fog * 0.6));
    billboardText(P(0, 239), 'FINISH', 30, '#ffffff');
  }
  function curveSign(cu, s, fog) {
    const c = courseAt(s);
    const nx = Math.cos(c.th), nz = -Math.sin(c.th);
    const side = cu.a > 0 ? -1 : 1;             // カーブの外側の壁の上に
    const wt = wallTop(side < 0 ? c.bl : c.br), top = wt.h;
    const x0 = side * (wt.x + 6), x1 = x0 + side * 110;
    const P = (x, y) => toCam(c.x + nx * x, c.y + y, c.z + nz * x);
    fillPoly([P(x0, top), P(x1, top), P(x1, top + 90), P(x0, top + 90)], shade(hex('#1f4e8c'), 1, fog));
    billboardText(P((x0 + x1) / 2, top + 45), String(cu.num), 52, '#ffffff', 1 - fog);
  }

  function drawTree(t, fog) {
    const b = toCam(t.x, t.y, t.z);
    if (b[2] < NEAR + 20) return;
    const tp = toCam(t.x, t.y + t.h, t.z);
    if (tp[2] < NEAR) return;
    const [bx, by] = proj(b), [tx, ty] = proj(tp);
    const w = t.r * FOCAL / b[2];
    if (w < 0.6) return;
    if (Math.max(bx, tx) < -w || Math.min(bx, tx) > W + w) return;
    const dx = tx - bx, dy = ty - by, len = Math.hypot(dx, dy) || 1;
    const px = -dy / len, py = dx / len;
    const cols = t.hue < 0.5 ? ['#1f5a3d', '#2c7650'] : ['#1b4d44', '#2a6b5c'];
    ctx.globalAlpha = 1 - fog * 0.85;
    for (let i = 0; i < 3; i++) {
      const f0 = 0.15 + i * 0.25, f1 = Math.min(1, f0 + 0.55);
      const ww = w * (1 - i * 0.25);
      const x0 = bx + dx * f0, y0 = by + dy * f0, x1 = bx + dx * f1, y1 = by + dy * f1;
      ctx.fillStyle = cols[i % 2];
      ctx.beginPath();
      ctx.moveTo(x0 + px * ww, y0 + py * ww);
      ctx.lineTo(x0 - px * ww, y0 - py * ww);
      ctx.lineTo(x1, y1);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.lineTo(bx + dx * 0.8 + px * w * 0.18, by + dy * 0.8 + py * w * 0.18);
    ctx.lineTo(bx + dx * 0.8 - px * w * 0.18, by + dy * 0.8 - py * w * 0.18);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // ---- スピード感：舞う雪、画面端の流れ、周辺の暗さ ----
  const flakes = Array.from({ length: 48 }, () => ({ x: (Math.random() * 2 - 1) * 320, y: (Math.random() * 2 - 1) * 200, z: 40 + Math.random() * 1100 }));
  function updateFX(dt) {
    const v = (mode === 'play' && S.phase !== 'push' ? S.v : S.v * 0.5) + 30;
    for (const f of flakes) {
      f.pz = f.z;
      f.z -= v * dt; f.y -= 25 * dt;
      if (f.z < 25) { f.z = 900 + Math.random() * 300; f.pz = f.z; f.x = (Math.random() * 2 - 1) * 320; f.y = (Math.random() * 2 - 1) * 200; }
    }
  }
  let vignette = null;
  function drawSpeedFX() {
    const kmh = S.v * KMH;
    ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineCap = 'round';
    for (const f of flakes) {
      const x = W / 2 + FOCAL * f.x / f.z, y = CY - FOCAL * f.y / f.z;
      const x0 = W / 2 + FOCAL * f.x / (f.pz + 6), y0 = CY - FOCAL * f.y / (f.pz + 6);
      const sz = Math.min(3.2, 260 / f.z);
      ctx.globalAlpha = Math.min(1, (1100 - f.z) / 300) * 0.8;
      ctx.lineWidth = sz;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x, y); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    if (kmh > 70) {
      const a = Math.min(0.32, (kmh - 70) / 140);
      ctx.strokeStyle = `rgba(255,255,255,${a})`; ctx.lineWidth = 1.5;
      const ph = clock * kmh / 60000;
      for (let i = 0; i < 22; i++) {
        const ang = i * 2.399 + 0.3, r0 = 330 + ((i * 97 + ph * 400) % 260);
        const ca = Math.cos(ang), sa = Math.sin(ang) * 0.75;
        ctx.beginPath(); ctx.moveTo(W / 2 + ca * r0, CY + sa * r0); ctx.lineTo(W / 2 + ca * (r0 + 60 + kmh * 0.4), CY + sa * (r0 + 60 + kmh * 0.4)); ctx.stroke();
      }
    }
  }
  function drawVignette() {
    if (!vignette) {
      vignette = ctx.createRadialGradient(W / 2, H * 0.45, 180, W / 2, H * 0.45, 560);
      vignette.addColorStop(0, 'rgba(8,20,38,0)'); vignette.addColorStop(1, 'rgba(8,20,38,0.45)');
    }
    ctx.globalAlpha = 0.25 + 0.6 * clamp(S.v * KMH / 130, 0, 1);
    ctx.fillStyle = vignette; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  // ---- そりの前部（カウル）と手 ----
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function drawCockpit() {
    const appear = clamp((66 - camEye) / 40, 0, 1);   // 座ると見える
    if (appear <= 0.02) return;
    const vib = S.phase === 'ride' ? (Math.random() - 0.5) * Math.min(3, S.v / 500) : 0;
    ctx.save();
    ctx.translate(W / 2, H + 8 + (1 - appear) * 220 + vib + bump * 2);
    const g = ctx.createLinearGradient(0, -190, 0, 0);
    g.addColorStop(0, '#ff5a64'); g.addColorStop(0.35, '#d62839'); g.addColorStop(1, '#7d0f1d');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(-290, 0);
    ctx.bezierCurveTo(-250, -95, -150, -150, -40, -168);
    ctx.quadraticCurveTo(0, -176, 40, -168);
    ctx.bezierCurveTo(150, -150, 250, -95, 290, 0);
    ctx.closePath();
    ctx.fill();
    // 塗装のつや（空の映り込み）
    const gl = ctx.createLinearGradient(-240, -170, 60, -40);
    gl.addColorStop(0, 'rgba(255,255,255,0)'); gl.addColorStop(0.42, 'rgba(220,235,255,0.30)');
    gl.addColorStop(0.5, 'rgba(255,255,255,0.08)'); gl.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gl; ctx.fill();
    // ふちのゴム
    ctx.strokeStyle = 'rgba(30,8,14,0.85)'; ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(-290, 0);
    ctx.bezierCurveTo(-250, -95, -150, -150, -40, -168);
    ctx.quadraticCurveTo(0, -176, 40, -168);
    ctx.bezierCurveTo(150, -150, 250, -95, 290, 0);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-200, -88); ctx.bezierCurveTo(-130, -138, -60, -155, 0, -158);
    ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(-10, -170); ctx.lineTo(10, -170); ctx.lineTo(26, 0); ctx.lineTo(-26, 0); ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#1b2633';
    roundRect(-34, -118, 68, 30, 6); ctx.fill();
    ctx.fillStyle = '#ffd166';
    ctx.font = '900 20px system-ui,sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('JPN', 0, -96);
    // 手とロープ（引いた側の手が手前に来る）
    const d = S.delta;
    for (const side of [-1, 1]) {
      const pull = Math.max(0, d * side);
      const hx = side * (150 - pull * 22), hy = -70 + pull * 34;
      ctx.strokeStyle = '#d9dde3'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(side * 70, -150); ctx.lineTo(hx, hy - 8); ctx.stroke();
      ctx.strokeStyle = '#9aa4ae'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(hx, hy - 6, 12, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = '#1b2633';
      ctx.beginPath(); ctx.ellipse(hx, hy + 6, 22, 17, side * 0.4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#2e6fb5';
      ctx.fillRect(hx - 18, hy + 16, 36, 40);
    }
    ctx.restore();
  }

  // プッシュ中：斜め後ろから見たそり（右下）
  function drawPushSled() {
    const appear = clamp((camEye - 36) / 30, 0, 1);
    if (appear <= 0.02) return;
    ctx.save();
    ctx.globalAlpha = appear;
    const bob = Math.sin(S.run / 22) * 4 * Math.min(1, S.v / 200);
    ctx.translate(W * 0.70, H * 0.84 + bob + (1 - appear) * 120);
    ctx.scale(0.62, 0.62);
    ctx.fillStyle = 'rgba(40,70,110,0.25)';
    ctx.beginPath(); ctx.ellipse(0, 70, 120, 26, 0, 0, Math.PI * 2); ctx.fill();
    const g = ctx.createLinearGradient(-110, 0, 110, 0);
    g.addColorStop(0, '#8d1222'); g.addColorStop(0.5, '#e63946'); g.addColorStop(1, '#8d1222');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(-95, 80);
    ctx.lineTo(-80, -40);
    ctx.quadraticCurveTo(-55, -150, 0, -175);
    ctx.quadraticCurveTo(55, -150, 80, -40);
    ctx.lineTo(95, 80);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.moveTo(-6, -172); ctx.lineTo(6, -172); ctx.lineTo(14, 80); ctx.lineTo(-14, 80); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#1b2633';
    ctx.beginPath(); ctx.ellipse(0, 10, 58, 80, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#9aa4ae'; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-82, -30); ctx.lineTo(-128, -10); ctx.stroke();
    ctx.fillStyle = '#1b2633';
    ctx.beginPath(); ctx.ellipse(-132, -8 + bob * 0.5, 16, 12, 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2e6fb5';
    ctx.save(); ctx.translate(-150, 10 + bob * 0.5); ctx.rotate(0.5); ctx.fillRect(-14, 0, 28, 80); ctx.restore();
    ctx.restore();
  }

  // ---- HUD ----
  function panel(x, y, w, h) { ctx.fillStyle = 'rgba(13,27,42,0.72)'; roundRect(x, y, w, h, 10); ctx.fill(); }
  function label(t, x, y, col = '#9fc3e0', size = 11) { ctx.fillStyle = col; ctx.font = `bold ${size}px system-ui,"Hiragino Sans",sans-serif`; ctx.fillText(t, x, y); }
  function centerText(txt, y, size, color, weight = 'bold', stroke = false) {
    ctx.textAlign = 'center';
    ctx.font = `${weight} ${size}px system-ui,"Hiragino Sans",sans-serif`;
    if (stroke) { ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(13,27,42,0.8)'; ctx.strokeText(txt, W / 2, y); }
    ctx.fillStyle = color;
    ctx.fillText(txt, W / 2, y);
  }
  // 区間 i（SPLITS.length ならゴール）での基準記録との差
  function diffAt(i, ref) {
    if (!ref) return null;
    const mine = i < SPLITS.length ? S.splits[i] : S.finalT;
    const r = i < SPLITS.length ? (ref.splits || [])[i] : ref.t;
    return mine === undefined || r === undefined ? null : mine - r;
  }
  const fmtD = d => (d <= 0 ? '−' : '+') + Math.abs(d).toFixed(2);
  const dCol = d => d <= 0 ? '#7ee081' : '#ff6b6b';
  function fmt(t) {
    if (t === null || t === undefined) return '--:--.--';
    const m = Math.floor(t / 60);
    return m + ':' + (t - m * 60).toFixed(2).padStart(5, '0');
  }
  const dirName = a => (a > 0 ? L('右 ', 'Right ') : L('左 ', 'Left ')) + Math.abs(a) + '°';

  // ミニマップ（真上から）
  let MAP;
  const buildMap = () => (function () {
    const pts = [];
    for (let s = 0; s <= S_FIN + 400; s += 120) { const c = courseAt(s); pts.push([c.x, c.z]); }
    let minX = 1e9, maxX = -1e9, minZ = 1e9, maxZ = -1e9;
    for (const [x, z] of pts) { minX = Math.min(minX, x); maxX = Math.max(maxX, x); minZ = Math.min(minZ, z); maxZ = Math.max(maxZ, z); }
    const size = 104, sc = size / Math.max(maxX - minX, maxZ - minZ);
    const ox = (size - (maxX - minX) * sc) / 2, oz = (size - (maxZ - minZ) * sc) / 2;
    const f = (x, z) => [ox + (x - minX) * sc, size - (oz + (z - minZ) * sc)];
    return { pts: pts.map(([x, z]) => f(x, z)), f, size };
  })();
  function drawMap() {
    const x0 = W - MAP.size - 22, y0 = 12;
    panel(x0 - 10, y0, MAP.size + 20, MAP.size + 20);
    ctx.save();
    ctx.translate(x0, y0 + 10);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 3;
    ctx.beginPath();
    MAP.pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
    ctx.stroke();
    const done = Math.min(MAP.pts.length - 1, Math.floor(S.s / 120));
    ctx.strokeStyle = '#4fc3f7';
    ctx.beginPath();
    for (let i = 0; i <= done; i++) i ? ctx.lineTo(MAP.pts[i][0], MAP.pts[i][1]) : ctx.moveTo(MAP.pts[i][0], MAP.pts[i][1]);
    ctx.stroke();
    for (let k = 0; k < SPLITS.length; k++) {
      const sc = courseAt(SPLITS[k].s), [sx, sy] = MAP.f(sc.x, sc.z);
      ctx.fillStyle = k <= lastSplit && mode === 'play' ? '#ffd166' : 'rgba(255,255,255,0.8)';
      ctx.fillRect(sx - 2, sy - 2, 4, 4);
    }
    const fc = courseAt(S_FIN), [fx, fy] = MAP.f(fc.x, fc.z);
    ctx.fillStyle = '#ffd166'; ctx.fillRect(fx - 3, fy - 3, 6, 6);
    const c = courseAt(Math.min(S.s, S_FIN + 400));
    const [mx, my] = MAP.f(c.x, c.z);
    ctx.fillStyle = '#e63946';
    ctx.beginPath(); ctx.arc(mx, my, 4.5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.restore();
  }

  // 断面ゲージ：そりの高さと、遠心力とつり合う高さ（緑）
  function drawHeightGauge() {
    const cx = W - 78, cy = H - 30, r = 52;
    panel(cx - 68, cy - 72, 136, 92);
    ctx.textAlign = 'left';
    label('HEIGHT', cx - 58, cy - 56);
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(cx, cy - 52, r, Math.PI * 0.08, Math.PI * 0.92); ctx.stroke();
    const posAng = ph => Math.PI / 2 - ph / (Math.PI / 2) * (Math.PI * 0.42);
    const c = courseAt(S.s);
    const fN = -S.v * S.v * c.k * CF;
    if (S.phase === 'ride' && Math.abs(fN) > 300) {
      const phiEq = Math.min(Math.atan(Math.abs(fN) / G), PHI_IDEAL) * Math.sign(fN);
      const a = posAng(phiEq);
      ctx.strokeStyle = 'rgba(126,224,129,0.9)'; ctx.lineWidth = 10;
      ctx.beginPath(); ctx.arc(cx, cy - 52, r, a - 0.18, a + 0.18); ctx.stroke();
    }
    const myPhi = S.phi > 0 ? S.phiS : S.u / FH * 0.12;
    const a = posAng(myPhi);
    const q = S.q;
    ctx.fillStyle = q === null ? '#ffffff' : q > 0.7 ? '#7ee081' : q > 0.4 ? '#ffd166' : '#ff6b6b';
    ctx.beginPath(); ctx.arc(cx + Math.cos(a) * r, cy - 52 + Math.sin(a) * r, 7, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#0d1b2a'; ctx.lineWidth = 2; ctx.stroke();
    if (q !== null) { ctx.textAlign = 'center'; label('LINE ' + Math.round(q * 100) + '%', cx, cy + 10, '#ffffff', 12); }
    ctx.textAlign = 'left';
  }

  // テレビ中継風の区間タイム表示（コースレコード比）
  function drawSplitPanel() {
    const i = lastSplit, t = S.splits[i], d = diffAt(i, rec), dp = diffAt(i, pb);

  }
  function drawHUD() {
    ctx.textAlign = 'left';
    panel(12, 12, 182, 66);
    label('TIME', 24, 30);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 28px ui-monospace,Menlo,monospace';
    ctx.fillText(S.phase === 'dnf' ? 'DNF' : fmt(S.phase === 'finish' ? S.finalT : S.t), 24, 60);

    else if (S.jumpRating && S.phase !== 'finish') {

    }

    if (S.phase !== 'push' && S.phase !== 'dnf') {

        }
      } else if (S.phase === 'ride') {

      }
      if (S.s < S_FIN && courseAt(S.s).gr < -0.005) label(L('▲ 上り坂', '▲ UPHILL'), W / 2, S.phase === 'crash' ? 248 : 204, '#ff9f43', 14);
      ctx.textAlign = 'left';
    }

    panel(12, H - 92, 150, 80);
    label('SPEED', 24, H - 74);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 30px ui-monospace,Menlo,monospace';
    ctx.fillText(String(Math.round(S.v * KMH)).padStart(3, ' '), 22, H - 44);
    ctx.font = 'bold 12px system-ui,sans-serif';
    ctx.fillText('km/h', 90, H - 44);
    label('G', 24, H - 22);
    const gl = S.phase === 'push' ? 1 : S.gload;

    ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fillRect(80, H - 30, 70, 8);

    if (S.phase !== 'push') drawHeightGauge();
    if (S.phase === 'ride' && S.danger > 0.05 && Math.floor(clock / 120) % 2) {

      centerText(L('⚠ 転倒注意！ 下げろ！', '⚠ CRASH RISK! GET DOWN!'), H * 0.62, 22, '#ff6b6b', '900', true);
      ctx.globalAlpha = 1;
    }
    if (S.phase === 'push' && mode === 'play') drawPushUI();
    drawCrew();
  }

  function drawPushUI() {
    const px = 60, py = 176, pw = W - 120;
    panel(px, py, pw, 82);
    ctx.textAlign = 'left';
    label('PUSH POWER', px + 14, py + 20);
    label(mashTimes.length + L(' 回/秒', ' /sec'), px + pw - 70, py + 20, '#ffffff');
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(px + 14, py + 28, pw - 28, 12);
    const pv = clamp(S.v / PUSH_MAX, 0, 1);
    ctx.fillStyle = pv > 0.85 ? '#ffd166' : '#4fc3f7';
    ctx.fillRect(px + 14, py + 28, (pw - 28) * pv, 12);
    label(L('乗り込みラインまで  ', 'To loading line  ') + Math.max(0, (JUMP_S - S.s) / PXM).toFixed(1) + 'm', px + 14, py + 58);
    const bw = pw - 28, bx = px + 14, by = py + 64;
    ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fillRect(bx, by, bw, 8);
    ctx.fillStyle = 'rgba(255,209,102,0.85)'; ctx.fillRect(bx + bw * (1 - GOOD_WIN / JUMP_S), by, bw * GOOD_WIN / JUMP_S, 8);
    ctx.fillStyle = 'rgba(126,224,129,0.95)'; ctx.fillRect(bx + bw * (1 - PERFECT_WIN / JUMP_S), by, bw * PERFECT_WIN / JUMP_S, 8);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(bx + bw * clamp(S.s / JUMP_S, 0, 1) - 2, by - 4, 4, 16);
    centerText(L('SPACE / PUSH 連打！', 'TAP SPACE / PUSH!'), py - 10, 18, '#ffffff', '900', true);
  }

  // 乗員パネル：横から見たそりに、前から順に4人が乗り込む
  function drawCrew() {
    if (mode !== 'play' && mode !== 'countdown') return;
    const now = clock;
    let alpha = 1;
    if (boardTime[3] > 0) alpha = clamp(1 - (now - boardTime[3] - 1500) / 500, 0, 1);
    if (alpha <= 0) return;
    ctx.save();
    ctx.globalAlpha = alpha;
    const x0 = W / 2 - 115, y0 = S.phase === 'push' ? 272 : 196, w = 230, h = 78;
    panel(x0, y0, w, h);
    // そり（横から、右が進行方向）
    const sx = x0 + 28, sy = y0 + 56;
    ctx.fillStyle = '#e63946';
    ctx.beginPath();
    ctx.moveTo(sx, sy - 10); ctx.lineTo(sx + 132, sy - 10);
    ctx.quadraticCurveTo(sx + 168, sy - 8, sx + 174, sy + 6);
    ctx.lineTo(sx, sy + 6); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#9aa4ae';
    ctx.fillRect(sx + 5, sy + 8, 160, 3);
    const names = ['PILOT', '2', '3', 'BRAKE'];
    const seatX = [sx + 130, sx + 96, sx + 62, sx + 28];
    for (let i = 0; i < 4; i++) {
      const tb = boardTime[i];
      const p = tb < 0 ? 0 : clamp((now - tb) / 260, 0, 1);
      const run = Math.sin(S.run / 18 + i * 1.6) * 3;
      const groundY = sy - 4;       // 横を走っているときの頭の位置
      const seatY = sy - 16;        // 座ったときの頭の位置
      const x = seatX[i] + (1 - p) * 6;
      const y = groundY - 14 + (seatY - (groundY - 14)) * p - Math.sin(p * Math.PI) * 14;
      if (p < 1) {
        ctx.strokeStyle = '#1b2633'; ctx.lineWidth = 3; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(x, y + 10); ctx.lineTo(x - 4 + run, y + 24);
        ctx.moveTo(x, y + 10); ctx.lineTo(x + 4 - run, y + 24);
        ctx.stroke();
        ctx.fillStyle = '#2e6fb5'; ctx.fillRect(x - 4, y, 8, 12);
      }
      ctx.fillStyle = i % 2 ? '#ffffff' : '#f1c40f';
      ctx.beginPath(); ctx.arc(x, y - 3, 6, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1; ctx.stroke();
      ctx.textAlign = 'center';
      label(names[i], seatX[i], y0 + 15, p >= 1 ? '#7ee081' : '#9fc3e0', 10);
    }
    ctx.textAlign = 'left';
    ctx.restore();
  }

  function drawPopups() {
    for (const p of popups) {
      const a = p.t < 0.15 ? p.t / 0.15 : clamp((p.life - p.t) / 0.4, 0, 1);
      ctx.globalAlpha = a;
      const y = H * 0.50 - p.t * 16;
      centerText(p.text, y, 34, p.color, '900', true);
      if (p.sub) centerText(p.sub, y + 26, 15, '#ffffff', '700', true);
    }
    ctx.globalAlpha = 1;
  }

  function drawOverlay() {
    if (mode === 'title') {
      ctx.fillStyle = 'rgba(13,27,42,0.62)';
      ctx.fillRect(0, 0, W, H);
      panel(30, 110, W - 60, 530);
      centerText('BOBSLED', 160, 40, '#ffffff', '900');
      // コース一覧（全景つき）
      drawCourseCards();
      centerText((COURSE_DEF.cc ? flag(COURSE_DEF.cc) + ' ' : '') + L(COURSE_DEF.country[0], COURSE_DEF.country[1]) + '　' + L(COURSE_DEF.sub, COURSE_DEF.subEn), 350, 13, '#ffffff', '800');
      centerText(L(COURSE_DEF.feat[0], COURSE_DEF.feat[1]), 370, 11.5, '#ffd166', '700');
      // 操作はこの3つだけ
      const keysHelp = [[L('SPACE 連打', 'Tap SPACE'), L('プッシュ', 'Push')], ['↓', L('乗り込み', 'Load in')], ['← →', L('操縦', 'Steer')]];
      keysHelp.forEach(([k, t], i) => {
        const y = 404 + i * 27;
        ctx.fillStyle = 'rgba(255,255,255,0.12)'; roundRect(110, y - 19, 130, 25, 7); ctx.fill();
        ctx.textAlign = 'center'; ctx.fillStyle = '#ffd166'; ctx.font = `900 ${k.length > 3 ? 15 : 22}px system-ui,"Hiragino Sans",sans-serif`;
        ctx.fillText(k, 175, y + (k.length > 3 ? -1 : 2));
        ctx.textAlign = 'left'; ctx.fillStyle = '#ffffff'; ctx.font = '800 16px system-ui,"Hiragino Sans",sans-serif';
        ctx.fillText(t, 262, y - 1);
      });
      centerText(L('自己ベスト ', 'PB ') + fmt(best) + L('　　コースレコード ', '    Record ') + (rec ? fmt(rec.t) + (rec.mine ? L('（あなた）', ' (you)') : rec.name ? ' (' + (rec.cc ? flag(rec.cc) + ' ' : '') + rec.name + ')' : '') : '--'), 490, 14, '#4fc3f7');
      centerText(L('SPACE でスタート', 'Press SPACE to start'), 626, 11, '#9fc3e0', '600');
    }
    if (mode === 'ranking') drawRanking();
    if (mode === 'countdown') {
      const n = Math.ceil(countdown);
      const f = countdown - Math.floor(countdown);
      ctx.globalAlpha = clamp(f * 1.5, 0, 1);
      centerText(String(n), H * 0.36, 120 + (1 - f) * 30, '#e63946', '900', true);
      ctx.globalAlpha = 1;
      centerText(L('GOで SPACE 連打！', 'On GO, tap SPACE fast!'), H * 0.46, 18, '#ffffff', '800', true);
    }
    if (mode === 'play' && S.phase === 'crash' && S.crashT < 4.5) {
      const a = clamp(S.crashT / 0.3, 0, 1) * clamp((4.5 - S.crashT) / 0.6, 0, 1);
      ctx.globalAlpha = a;
      panel(50, 250, W - 100, 92);
      centerText(L('転倒！', 'CRASH!'), 290, 30, '#ff6b6b', '900');
      centerText(L('横倒しのままゴールを目指せ（操縦不能）', 'Slide on your side to the finish (no steering)'), 322, 14, '#ffffff', '700');
      ctx.globalAlpha = 1;
    }
    if (mode === 'play' && S.phase === 'crash' && S.crashT >= 4.5) {
      ctx.textAlign = 'center';
      panel(W / 2 - 90, 196, 180, 30);
      label(L('転倒中 … ゴールまで ', 'Crashed … to finish ') + Math.max(0, Math.round((S_FIN - S.s) / PXM)) + 'm', W / 2, 216, '#ff6b6b', 13);
      ctx.textAlign = 'left';
    }
    if (mode === 'play' && S.phase === 'dnf') {
      ctx.fillStyle = 'rgba(80,0,10,0.25)'; ctx.fillRect(0, 0, W, H);
      panel(40, 200, W - 80, 290);
      centerText(L('停止', 'STOPPED'), 262, 44, '#ff6b6b', '900');
      centerText('DNF', 306, 30, '#ffffff', '900');
      const left = Math.max(1, Math.round((S_FIN - S.s) / PXM));
      centerText(L('カーブ ' + S.crashCurve + ' で転倒 → ゴールまで残り ' + left + 'm で停止', 'Crashed in curve ' + S.crashCurve + ' → stopped ' + left + 'm before the finish'), 346, 14, '#ffffff', '700');
      centerText(L('転倒しても、ゴールを切れば完走扱い', 'A crashed sled still counts if it crosses the line'), 378, 13, '#9fc3e0', '600');
      centerText(L('SPACE：リトライ  /  T：コース選択', 'SPACE: retry  /  T: courses'), 412, 11, '#9fc3e0', '600');
    }
    if (mode === 'play' && S.phase === 'finish') {
      const a = clamp((1300 - S.v) / 500, 0, 1);
      ctx.globalAlpha = a;
      panel(40, 150, W - 80, 400);
      centerText('FINISH!', 205, 38, '#ffffff', '900');
      centerText(fmt(S.finalT), 265, 46, '#ffffff', '800');
      if (newCR) {
        ctx.globalAlpha = a * (0.6 + 0.4 * Math.sin(performance.now() / 150));
        centerText('★ NEW COURSE RECORD ★', 300, 22, '#ffd166', '900');
        ctx.globalAlpha = a;
        if (prevRec) centerText(L('これまでのコースレコード ', 'Previous record ') + fmt(prevRec.t) + '  (' + fmtD(S.finalT - prevRec.t) + ')', 324, 13, '#9fc3e0', '700');
      } else {
        const d = rec ? S.finalT - rec.t : null;
        if (d !== null) centerText(L('コースレコード ', 'Record ') + fmt(rec.t) + (rec.name && !rec.mine ? ' (' + rec.name + ')' : '') + '  ' + fmtD(d), 300, 17, dCol(d), '800');
        if (newRecord) centerText(L('自己ベスト更新！', 'NEW PERSONAL BEST!') + (prevPb ? '  (' + fmtD(S.finalT - prevPb.t) + ')' : ''), 324, 14, '#ffd166', '800');
        else if (perImproved.length) {
          const big = ['m', 'w', 'd'].find(p => perImproved.includes(p));
          centerText(L(perName(big) + 'のベスト更新！', perName(big) + "'s best!") + (pb ? L('　自己ベスト ', '  PB ') + fmt(pb.t) : ''), 324, 14, '#ffd166', '800');
        }
        else if (pb) centerText(L('自己ベスト ', 'PB ') + fmt(pb.t) + '  (' + fmtD(S.finalT - pb.t) + ')', 324, 13, '#9fc3e0', '700');
      }
      // 区間ごとのコースレコード比
      const ref = newCR ? prevRec : rec;
      const cols = SPLITS.length + 1, cw = (W - 100) / cols;
      for (let k = 0; k < cols; k++) {
        const cx = 50 + cw * (k + 0.5);
        ctx.textAlign = 'center';
        label(k < SPLITS.length ? SPLITS[k].name : 'FINISH', cx, 350, '#9fc3e0', 10);
        const mine = k < SPLITS.length ? S.splits[k] : S.finalT;
        const r = ref ? (k < SPLITS.length ? ref.splits[k] : ref.t) : undefined;
        if (mine !== undefined && r !== undefined) label(fmtD(mine - r), cx, 368, dCol(mine - r), 13);
        else if (mine !== undefined) label(mine.toFixed(2), cx, 368, '#ffffff', 12);
      }
      const lineAcc = S.sumQT > 0 ? Math.round(S.sumQ / S.sumQT * 100) : 0;
      const rows = [
        [L('スタート', 'Start'), S.jumpT.toFixed(2) + 's  ' + Math.round(S.jumpV * KMH) + 'km/h  ' + S.jumpRating],
        [L('ライン精度', 'Line accuracy'), lineAcc + ' %'],
        [L('壁ヒット', 'Wall hits'), S.hits + L(' 回', '')],
        [L('転倒', 'Crash'), S.crashed ? L('あり（カーブ ' + S.crashCurve + '）', 'yes (curve ' + S.crashCurve + ')') : L('なし', 'no')],
      ];
      rows.forEach(([k, v], i) => {
        const yy = 394 + i * 23;
        ctx.textAlign = 'left';
        ctx.font = 'bold 14px system-ui,"Hiragino Sans",sans-serif';
        ctx.fillStyle = '#9fc3e0'; ctx.fillText(k, 80, yy);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#ffffff'; ctx.fillText(v, W - 80, yy);
      });
      if (S.v < 60) centerText(lbMsg || L('SPACE：リトライ  /  L：ランキング  /  T：コース選択', 'SPACE: retry  /  L: ranking  /  T: courses'), 486, lbMsg ? 13 : 11, lbMsg ? '#ffd166' : '#9fc3e0', lbMsg ? '800' : '600');
      ctx.globalAlpha = 1;
    }
  }

  function draw() {
    ctx.setTransform(pxScale, 0, 0, pxScale, 0, 0);
    buildCamera();
    drawBackground();
    drawTrack();
    if (mode !== 'title' && mode !== 'ranking') drawSpeedFX();
    drawPushSled();
    drawCockpit();
    drawVignette();
    if (mode !== 'title' && mode !== 'ranking') drawHUD();
    drawPopups();
    drawOverlay();
    drawButtons();
  }

  (function () {
    let id = null; try { id = localStorage.getItem('bobsled_course'); } catch (e) {}
    selectCourse(Math.max(0, COURSES.findIndex(c => c.id === id)));
  })();

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  // テスト用フック
  window.__bob = { get S() { return S; }, set S(v) { S = v; }, setMode(m) { mode = m; }, setCam(e, sd, b) { camEye = e; camSide = sd; camBack = b; }, step(dt) { update(dt); draw(); } };
})();
</script>
</body>
</html>
